task:
  name: Build NixOS Kernel (master)
  timeout_in: 180m
  container: { image: "nixos/nix:latest", cpu: 8, memory: "32G" }
  env: { NIX_CONFIG: "max-jobs = auto", CACHIX_AUTH_TOKEN: "ENCRYPTED[!cc7126ff7084e71fb6117f512316fb55f0845fd36d3ba5ffdddc879904c7578be77a3ade4043337a0aa27898ec23db26!]", GITHUB_TOKEN: "ENCRYPTED[!b0a28a9a328daf92f7bfdf3d5603d2e5e130127f32d2e6311e702c154141e558c7a80e7199305f109a1ba46cd811910b!]" }
  setup_nix_script: >
    echo "trusted-users = root@localhost" >> /etc/nix/nix.conf;
    echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf;
    echo "extra-substituters = https://cache.nixos.org https://nixos-kernel-master.cachix.org https://hyprland.cachix.org https://cache.garnix.io https://yuda-libreoffice-cache.cachix.org https://yuda-librewolf-cache.cachix.org https://kalishxern-nixos.cachix.org" >> /etc/nix/nix.conf;
    echo "extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nixos-kernel-master.cachix.org-1:bUDOUsQh34oWGGJ0IpFNCkgiUEYWqrwM2f92NKZQE/I= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc= cache.garnix.io:CTFPyKSLcx5RMJKfLo5EEPUObbA78b0YQ2DTCJXqr9g= yuda-libreoffice-cache.cachix.org-1:xbvCpBM6HT1DP3DeSIztxOKnoTytRr7KAG5hFRatMV4= yuda-librewolf-cache.cachix.org-1:Ua0xCOsrpZeHRzPx15/hmloCcsVF3Aa9wvCRVLkxPRg= kalishxern-nixos.cachix.org-1:Gfbug1BsE52uqhrM1PqPdndbD48AnD2qA8+bYFb3SYE=" >> /etc/nix/nix.conf
  build_script: >
    git clone https://oauth2:$GITHUB_TOKEN@github.com/kalishxern/nixos-config;
    cd nixos-config;
    nix flake update nixpkgs-master;
    nix run "nixpkgs#cachix" -- authtoken $CACHIX_AUTH_TOKEN;
    nix run "nixpkgs#cachix" -- use nixos-kernel-master;
    nix run "nixpkgs#cachix" -- use hyprland;
    nix run "nixpkgs#cachix" -- use kalishxern-nixos;
    nix run "nixpkgs#cachix" -- watch-exec nixos-kernel-master -- nix build ".#nixosConfigurations.nixos-ci.config.system.build.toplevel" --no-link --print-out-paths
