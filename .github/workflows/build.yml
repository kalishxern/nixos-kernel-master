name: Build NixOS
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v15
        with:
          name: nixos-kernel-master
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Build NixOS CI config
        run: |
          nix build .#nixosConfigurations.nixos-ci.config.system.build.toplevel --no-link
